[project]
name = "agent"
version = "0.1.0"
description = "Ablation study of multi-agent LLM pipelines for GitHub issue resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "docker>=7.1",
    "langgraph>=0.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
# Evaluation harness (Phase 3): official SWE-bench scoring, dataset access, plots.
eval = [
    "datasets>=3.0",
    "matplotlib>=3.9",
    "swebench==5.0.2",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-docker>=7.1",
    "types-pyyaml>=6.0",
]

[project.scripts]
agent-run = "agent.run:main"
agent-dashboard = "agent.dashboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "eval", "pilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/calc_repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0911", "PLR0913", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "."]
packages = ["agent", "eval", "pilot", "tests"]
exclude = ["tests/fixtures/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "swebench.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a reachable Docker daemon (real sandbox, never mocked)",
    "live: calls the real Anthropic API; needs --run-live and ANTHROPIC_API_KEY",
    "swebench: builds/pulls real SWE-bench images (~GBs); needs --run-swebench",
    "github: read-only calls to the real GitHub API; needs --run-github and GITHUB_TOKEN",
]
